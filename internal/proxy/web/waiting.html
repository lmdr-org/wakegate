<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Waking up {{.Target}}</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --accent: #3a6ea5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecebe7; --muted: #9a9993; --accent: #7aa7d8; }
  }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 1.25rem 0 .5rem; }
  p { color: var(--muted); margin: .25rem 0; }
  .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--accent); display: inline-block;
         animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <span class="dot" aria-hidden="true"></span>
  <h1>{{.Service}} will be back in a moment</h1>
  <p>{{.Line}}</p>
  <p>This page reloads by itself.</p>
</main>
</body>
</html>
